/**:
  ros__parameters:
    # With one connected camera, camera_ros automatically selects the OV5647.
    # The "0:" shown during discovery is an index, not a camera name.
    format: "BGR888"
    width: 640
    height: 480
    frame_id: "camera_optical_frame"

    # Approximate intrinsics make CameraInfo usable for RTAB-Map appearance
    # testing. Replace this file with a physical calibration before using
    # visual geometry quantitatively.
    camera_info_url: "file:///workspaces/robot_sim_sose/src/xgo_driver_bridge/config/xgo_camera_640x480_approx.yaml"
