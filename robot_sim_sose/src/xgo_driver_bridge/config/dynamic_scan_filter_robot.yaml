dynamic_scan_filter:
  ros__parameters:
    # Live LD19 scans are already regular; the offline bag scan normalizer is
    # intentionally not used by the real-robot bring-up.
    input_scan_topic: /scan
    output_scan_topic: /scan_filtered
    tracking_frame: odom
    output_reliability: reliable

    association_distance: 0.45
    motion_jitter_tolerance: 0.10
    range_adjustment_min_scale: 0.35
    moving_speed_threshold: 0.22
    static_speed_threshold: 0.10
    moving_confirmations: 6
    static_confirmations: 8
    static_release_delay_sec: 3.0
    filter_unconfirmed: false
