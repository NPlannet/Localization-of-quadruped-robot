/**:
  ros__parameters:
    use_sim_time: true

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_normalized

    mode: mapping
    resolution: 0.05
    map_update_interval: 2.0

    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_publish_period: 0.02
    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    scan_queue_size: 50
    use_scan_matching: true
    use_scan_barycenter: true
    # Keep enabled for a fair accuracy comparison with Cartographer, whose
    # pose graph also searches for loop-closure constraints.
    do_loop_closing: true

    lifelong_search_use_tree: false
    lifelong_minimum_score: 0.1
    lifelong_iou_match: 0.85
    lifelong_node_removal_score: 0.04
    lifelong_overlap_score_scale: 0.06
    lifelong_constraint_multiplier: 0.08
    lifelong_nearby_penalty: 0.001
    lifelong_candidates_scale: 0.03
